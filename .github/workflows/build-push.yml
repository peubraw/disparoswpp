name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/peubraw

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          push: true
          tags: ghcr.io/peubraw/disparoswpp-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          push: true
          tags: ghcr.io/peubraw/disparoswpp-app:latest
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/disparoswpp
            NEXT_PUBLIC_APP_URL=https://painel.quantumkey.com.br/disparoswpp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/Dockerfile
          push: true
          tags: ghcr.io/peubraw/disparoswpp-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
